<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>משחקי אמה ואבא</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu" class="screen">
  <div class="menu-inner">
    <div class="title">
      <img src="emma.jpg" class="face black" alt="">
      <h1>המשחקים של אמה ואבא</h1>
      <img src="dad.jpg" class="face white" alt="">
    </div>

    <div class="games">
      <button id="btnCheckers" class="game-btn"><span class="gi">♛</span>דמקה</button>
      <button id="btnBackgammon" class="game-btn"><span class="gi">🎲</span>שש-בש</button>
      <button id="btnTicTacToe" class="game-btn"><span class="gi">⭕</span>איקס מיקס דריקס</button>
      <button id="btnFourRow" class="game-btn"><span class="gi">🔵</span>ארבע בשורה</button>
      <button id="btnMemory" class="game-btn"><span class="gi">🃏</span>משחק זיכרון</button>
      <button id="btnReversi" class="game-btn"><span class="gi">🔄</span>רברסי</button>
      <button id="btnLadders" class="game-btn"><span class="gi">🪜</span>סולמות וחבלים</button>
      <button id="btnGomoku" class="game-btn"><span class="gi">✋</span>חמש בשורה</button>
    </div>

    <div class="opts">
      <div class="row">
        <span class="lbl">⚫ שחור:</span>
        <div class="pick" data-side="b"></div>
      </div>
      <div class="row">
        <span class="lbl">⚪ לבן:</span>
        <div class="pick" data-side="w"></div>
      </div>
      <div class="row">
        <span class="lbl">משחקים נגד:</span>
        <div class="seg" data-key="opponent">
          <button data-val="human">חבר/ה</button>
          <button data-val="cpu">המחשב</button>
        </div>
      </div>
      <div class="row cpu-only">
        <span class="lbl">אני משחק/ת עם:</span>
        <div class="seg" data-key="myColor">
          <button data-val="b" id="myColorB"></button>
          <button data-val="w" id="myColorW"></button>
        </div>
      </div>
      <div class="row cpu-only">
        <span class="lbl">רמה:</span>
        <div class="seg" data-key="level">
          <button data-val="easy">קל</button>
          <button data-val="mid">בינוני</button>
          <button data-val="hard">קשה</button>
        </div>
      </div>
      <details>
        <summary>חוקי דמקה</summary>
        <label><input type="checkbox" data-key="ck_force"> חובה לאכול</label>
        <label><input type="checkbox" data-key="ck_back"> חייל רגיל יכול לאכול אחורה</label>
        <label><input type="checkbox" data-key="ck_fly"> מלך "עף" (זז כמה משבצות)</label>
      </details>
    </div>
  </div>
</div>

<div id="game" class="screen hidden">
  <div id="panel">
    <div id="turn">
      <img id="turnFace" alt="">
      <div id="turnText"></div>
    </div>
    <div id="msg"></div>
    <button id="btnRoll" class="primary">הטל קוביות</button>
    <button id="btnUndo">↶ בטל</button>
    <div class="spacer"></div>
    <button id="btnNew">משחק חדש</button>
    <button id="btnMenu">תפריט</button>
  </div>
  <div id="boardWrap"><canvas id="cv"></canvas></div>
</div>

<div id="overlay" class="hidden">
  <div id="laughLayer" class="hidden"></div>
  <div class="card">
    <img id="winFace" alt="">
    <h2 id="winText"></h2>
    <div id="winTaunt"></div>
    <div class="card-btns">
      <button id="ovNew" class="primary">עוד משחק!</button>
      <button id="ovMenu">תפריט</button>
    </div>
  </div>
</div>

<div id="addDlg" class="modal hidden">
  <div class="card add-card">
    <div class="add-row">
      <div class="crop-wrap">
        <canvas id="cropCv"></canvas>
        <div id="cropEmpty">📷<br>בחרו תמונה</div>
      </div>
      <div class="add-form">
        <h2>שחקן/ית חדש/ה</h2>
        <input id="newName" type="text" maxlength="12" placeholder="שם" autocomplete="off">
        <div class="seg" id="newGender">
          <button data-val="m">בן</button>
          <button data-val="f">בת</button>
        </div>
        <div class="photo-btns">
          <label class="btn">📷 צילום<input type="file" accept="image/*" capture="user" id="fileCam" hidden></label>
          <label class="btn">🖼️ מהגלריה<input type="file" accept="image/*" id="fileGal" hidden></label>
        </div>
        <div id="zoomRow" class="hidden">🔍 <input type="range" id="zoom" min="1" max="4" step="0.01" value="1"></div>
        <div id="cropHint" class="hint hidden">גררו את התמונה כדי למרכז את הפנים בעיגול</div>
        <div class="card-btns">
          <button id="addSave" class="primary">שמירה</button>
          <button id="addCancel">ביטול</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="laughDlg" class="modal hidden">
  <div class="card laugh-card">
    <img id="laughFace" alt="">
    <h2 id="laughTitle"></h2>
    <div id="laughStatus" class="hint"></div>
    <div class="card-btns">
      <button id="recBtn" class="primary">🎤 הקלט</button>
      <button id="playBtn">▶️ השמע</button>
      <button id="delLaughBtn">🗑️ מחק</button>
    </div>
    <div class="card-btns laugh-done"><button id="laughDone">סיום</button></div>
  </div>
</div>

<div id="confirmDlg" class="modal hidden">
  <div class="card">
    <h2 id="confirmText"></h2>
    <div class="card-btns">
      <button id="confirmYes" class="primary">כן</button>
      <button id="confirmNo">לא</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="laugh.js"></script>
<script src="checkers.js"></script>
<script src="backgammon.js"></script>
<script src="tictactoe.js"></script>
<script src="fourrow.js"></script>
<script src="memory.js"></script>
<script src="reversi.js"></script>
<script src="ladders.js"></script>
<script src="gomoku.js"></script>
<script src="app.js"></script>
</body>
</html>
